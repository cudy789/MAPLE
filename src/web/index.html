<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MAPLE Pose Vis</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 15px;
            padding: 12px 18px;
            background: rgba(30, 30, 30, 0.9);
            color: #4CAF50;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(12px, 0.9vw, 16px);  /* Scales with screen width */
            line-height: 1.6;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            white-space: pre-wrap;
            word-break: break-word;
            z-index: 100;
        }

        #edit-config-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 101;
            background: #2b392b;
            color: #4CAF50;
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #edit-config-btn:hover {
            background-color: #305e30;
        }

        #mjpeg-container {
            position: fixed;
            top: 90px;
            left: 15px;
            max-height: calc(100vh - 110px); /* 90px top + 20px bottom buffer */

            max-width: 35vw;
            overflow-y: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 200;

            background-color: black;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            border-radius: 4px;
        }

        #mjpeg-stream {
            width: 100%;               /* fill container, but allow container to shrink */
            height: auto;
            margin: 0 auto;
            max-width: 100%;
            max-height: 100vh;

            object-fit: contain;
            border-radius: 5px; /* match container */
        }

        #recenter-btn {
            position: absolute;
            top: 60px;
            right: 15px;
            z-index: 101;
            background: #2b392b;
            color: #4CAF50;
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        #recenter-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #recenter-btn:hover {
            background-color: #305e30;
        }

    </style>
</head>
<body>

<!-- Info & Buttons -->
<div id="info">No connection...</div>
<button id="edit-config-btn" onclick="window.location.href='configure.html'">Settings</button>
<button id="recenter-btn">Recenter</button>


<!-- MJPEG Video Container -->
<div id="mjpeg-container">
    <img id="mjpeg-stream" alt="MJPEG Stream">
</div>

<script type="module">

    const mjpegStream = document.getElementById('mjpeg-stream');

    const webSocketUrl = `ws://${window.location.hostname}:8082`;
    const streamUrl = `http://${window.location.hostname}:8081`;

    mjpegStream.src = streamUrl;

    mjpegStream.onload = () => {
        console.log('MJPEG stream connected');
        // const naturalWidth = mjpegStream.naturalWidth;
        // const naturalHeight = mjpegStream.naturalHeight;
        // //
        // // // Set the size of the image element dynamically
        // mjpegStream.style.width = `${naturalWidth}px`;
        // mjpegStream.style.height = `${naturalHeight}px`;
    };

    mjpegStream.onerror = () => {
        console.warn('MJPEG stream disconnected. Attempting to reconnect...');
    };

    import * as THREE from './js/three.module.js';
    import { OrbitControls } from './js/OrbitControls.js';
    import { GLTFLoader } from './js/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMappingExposure = 1;
    renderer.toneMapping = THREE.LinearToneMapping;
    document.body.appendChild(renderer.domElement);

    // Add lighting
    const light = new THREE.AmbientLight( 0xffffff, 1.5 );
    scene.add( light );
    const directionalLightTop = new THREE.DirectionalLight( 0xffffff, 2.5 );
    scene.add( directionalLightTop );
    const directionalLightLeft = new THREE.DirectionalLight( 0xffffff, 2.5 );
    directionalLightLeft.position.set(-100, 0, 0);
    scene.add( directionalLightLeft );
    const directionalLightRight= new THREE.DirectionalLight( 0xffffff, 2.5 );
    directionalLightRight.position.set(100, 0, 0);
    scene.add( directionalLightRight );

    scene.background = new THREE.Color( 0x191919 );

    let robot_model;
    const robot_group = new THREE.Group();

    const loader = new GLTFLoader();

    loader.load( './js/drone_low_poly.glb', function ( gltf ) {

            robot_model = gltf.scene;
            robot_model.scale.set(0.003, 0.003, 0.003);
            robot_model.rotation.set(0, 0, Math.PI/2);
            robot_group.add(robot_model);
            scene.add( robot_group );

        },
        function ( xhr ) {

            console.log( ( xhr.loaded / xhr.total * 100 ) + '% loaded' );

        },
        function ( error ) {

            console.error( error );

    } );

    const axes = new THREE.AxesHelper( 1 );
    axes.rotation.set(0, -Math.PI/2, Math.PI)
    robot_group.add(axes);

    const gridHelper = new THREE.GridHelper(100, 100);

    scene.add(gridHelper);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.minDistance = 0.1;
    controls.maxDistance = 10;
    controls.screenSpacePanning = false;

    camera.position.x = 0;
    camera.position.y = 0;
    camera.position.z = 2;
    controls.update();

    // Let user take control
    let userHasControl = false;
    const recenterBtn = document.getElementById('recenter-btn');
    controls.addEventListener('start', () => {
        userHasControl = true;
        recenterBtn.classList.add('visible');
    });
    recenterBtn.addEventListener('click', () => {
        userHasControl = false;
        recenterBtn.classList.remove('visible');
    });


    // Webpage coord display
    const infoDiv = document.getElementById('info');
    const socket = new WebSocket(webSocketUrl);

    infoDiv.setAttribute('style', 'white-space: pre;');

    // Load FMAP file from MAPLE
    async function loadFMap(url) {
        const response = await fetch(url);
        const json = await response.json();
        return json.fiducials;
    }
    function objectFromFMapTransform(transformArray) {
        const obj = new THREE.Object3D();

        // Load matrix (row-major → Three.js handles conversion)
        const m = new THREE.Matrix4();
        m.fromArray(transformArray);

        // Decompose into position / rotation / scale
        m.decompose(obj.position, obj.quaternion, obj.scale);

        return obj;
    }
    function createTextSprite(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = '48px monospace';
        ctx.fillStyle = 'white';
        ctx.fillText(text, 10, 50);

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(material);

        sprite.scale.set(0.5, 0.25, 1);
        return sprite;
    }
    function createENUAxes(length = 1) {
        const group = new THREE.Group();

        const xMat = new THREE.LineBasicMaterial({ color: 0xff0000 }); // East
        const yMat = new THREE.LineBasicMaterial({ color: 0x00ff00 }); // North
        const zMat = new THREE.LineBasicMaterial({ color: 0x0000ff }); // Up

        const eastGeom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(1, 0, 0)
        ]);

        const northGeom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
        ]);

        const upGeom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 1, 0)
        ]);

        group.add(new THREE.Line(eastGeom, xMat));   // Red = East
        group.add(new THREE.Line(northGeom, yMat));  // Green = North
        group.add(new THREE.Line(upGeom, zMat));     // Blue = Up

        group.scale.set(length, length, length);

        // Rotate ENU frame by -90° about Z
        // group.rotation.z = -Math.PI / 2;

        return group;
    }

    const enuAxes = createENUAxes(1.0);
    scene.add(enuAxes);

    const ENU_TO_THREE = new THREE.Matrix4().set(
        0,  0, -1, 0,   // X = -North
        -1,  0,  0, 0,   // Y = -East
        0,  1,  0, 0,   // Z = Up
        0,  0,  0, 1
    );

    const aprilTagGroup = new THREE.Group();
    scene.add(aprilTagGroup);

    loadFMap('./api/get-fmap').then(fiducials => {
        fiducials.forEach(tag => {

            // Create pose object from fmap transform
            const tagPose = objectFromFMapTransform(tag.transform);

            // Apply ENU → Three.js conversion
            tagPose.applyMatrix4(ENU_TO_THREE);

            // Create visual tag mesh
            const sizeMeters = tag.size / 1000; // mm → meters
            const geometry = new THREE.PlaneGeometry(sizeMeters, sizeMeters);
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide
            });

            const tagMesh = new THREE.Mesh(geometry, material);
            tagMesh.rotateX(-Math.PI / 2);

            tagPose.add(tagMesh);

            // Add tag axes
            tagPose.add(new THREE.AxesHelper(sizeMeters * 0.6));

            // Add ID label
            const label = createTextSprite(`Tag ${tag.id}`);
            label.position.set(0, sizeMeters * 0.6, 0);
            tagPose.add(label);

            aprilTagGroup.add(tagPose);
        });
    });




    // Open socket connection to MAPLE instance
    socket.onopen = () => {
        console.log('WebSocket connection established');
        infoDiv.textContent = 'Connected'

    };

    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if ('x' in data && 'y' in data && 'z' in data &&
                'roll' in data && 'pitch' in data && 'yaw' in data) {

                // // Update robot's position & rotation
                robot_group.position.set(-data.y, data.z, -data.x);
                robot_group.rotation.set(data.pitch / 180 * Math.PI + Math.PI, (data.yaw / 180 * Math.PI), data.roll / 180 * Math.PI);

                infoDiv.textContent = `Global position - x: ${data.x.toFixed(2)}, y: ${data.y.toFixed(2)}, z: ${data.z.toFixed(2)} ` +
                    `roll: ${(data.roll).toFixed(2)}, pitch: ${(data.pitch).toFixed(2)}, yaw: ${(data.yaw).toFixed(2)} \n` +
                    `Robot relative tag position ${data.rob_rel_id} - x: ${data.rob_rel_x.toFixed(2)}, y: ${data.rob_rel_y.toFixed(2)}, z: ${data.rob_rel_z.toFixed(2)}, roll: ${data.rob_rel_roll.toFixed(2)}, pitch: ${data.rob_rel_pitch.toFixed(2)}, yaw: ${data.rob_rel_yaw.toFixed(2)}`;
            }
        } catch (error) {
            console.error('Error parsing WebSocket message:', error);
        }
    };

    socket.onerror = (error) => {
        console.error('WebSocket error:', error);
    };

    socket.onclose = () => {
        console.log('WebSocket connection closed');
        infoDiv.textContent += '   ### Lost connection ##'
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix(); // Update the camera projection
        renderer.setSize(window.innerWidth, window.innerHeight); // Update renderer size
    });

    function animate() {
        if (!userHasControl && robot_group) {
            const targetPosition = new THREE.Vector3().copy(robot_group.position);
            const desiredCameraOffset = new THREE.Vector3(0, 2, 3); // Slightly above and behind
            const desiredCameraPosition = targetPosition.clone().add(desiredCameraOffset);

            // Smooth camera movement
            camera.position.lerp(desiredCameraPosition, 0.02);
            controls.target.lerp(targetPosition, 0.02);
        }

        controls.update();
        controls.target.set(controls.target.x, 0, controls.target.z); // Keep camera flat on Z plane
        renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);
</script>

</body>
</html>
